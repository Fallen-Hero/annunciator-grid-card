# Group headers with alerting-only group ACK behavior.
type: custom:annunciator-grid-card
title: Grouped Panel
show_group_headers: true
group_ack:
  ack_scope: alerting
  include_change: true
group_header:
  show_buttons: true
  button_mode: text
  show_ack_alerts_button: true
  divider: true
entities:
  - entity: binary_sensor.boiler_trip
    group: Boiler
    lamp_type: alarm
    color_behavior: severity
    severity: trip
    alert_style: blink
    ack_rearm: auto
  - entity: binary_sensor.boiler_flame
    group: Boiler
    lamp_type: status
    color_behavior: standard
    alert_style: none
  - entity: binary_sensor.pump_trip
    group: Pumps
    lamp_type: alarm
    color_behavior: severity
    severity: alarm
    alert_style: pulse
    ack_rearm: auto
