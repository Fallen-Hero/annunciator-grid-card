# Traditional alarm lamp with Severity color and blinking until ACK.
type: custom:annunciator-grid-card
title: Alarm Example
panel_id: alarm_example
show_ack_all: true
show_clear_ack: true
entities:
  - entity: binary_sensor.boiler_trip
    lamp_type: alarm
    color_behavior: severity
    severity: trip
    eval_mode: toggle
    alert_style: blink
    alert_when: on
    ack_rearm: auto
    primary_mode: name
    secondary_mode: state
