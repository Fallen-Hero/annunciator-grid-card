type: custom:annunciator-grid-card
config_version: 2
title: UNIT 1 ANNUNCIATOR
panel_id: unit1
columns: 4
row_mode: auto
panel_sizing: auto_fit
cell_width: 200
cell_height: 120
cell_gap: 0
mullion: 6
outer_frame: 6
cell_padding: 10
font_size: 13
font_weight: "700"
line_height: 1.15
corner_style: rounded
corner_radius: 8
panel_theme: classic
default_lamp_style: retro
default_lens_type: plastic
retro_warmup: true
show_reset_ack: true
reset_ack_action: clear
ack_store:
  type: input_text
  entity: input_text.annunciator_ack_map
lamp_test_entity: input_boolean.annunciator_lamp_test
lamp_test_mode: steady
show_group_headers: true
group_ack:
  ack_scope: alerting
  include_change: true
group_header:
  show_buttons: true
  button_mode: icons
  show_ack_alerts_button: true
  divider: true
history_overlay:
  enabled: true
  show_icon: true
entities:
  - entity: binary_sensor.boiler_trip
    name_override: BOILER TRIP
    label_source: custom
    group: BOILER
    lamp_type: alarm
    severity: trip
    alert_style: blink
    alert_when: on
    ack_rearm: auto
    primary_mode: name
    secondary_mode: state

  - entity: sensor.stack_temperature
    name_override: STACK TEMP
    label_source: custom
    group: BOILER
    lamp_type: sensor
    always_on: true
    primary_mode: name
    secondary_mode: state
    value_format:
      decimals: 1
      rounding: round
      unit: auto
      convert: none
      scale: 1
      offset: 0
      mode: auto
    enable_auto_styles: true
    auto_styles:
      - name: High stack temperature
        kind: numeric
        rule:
          type: above
          a: 170
          inclusive: true
        severity: alarm
        alert: pulse
        force_on: true

  - entity: binary_sensor.feed_pump_running
    name_override: FEED PUMP RUNNING
    label_source: custom
    group: FEEDWATER
    lamp_type: status
    severity: status
    alert_style: none
    pair_id: pair_feed_pump
    pair_mode: top
    primary_mode: name

  - entity: binary_sensor.feed_pump_trip
    name_override: FEED PUMP TRIP
    label_source: custom
    group: FEEDWATER
    lamp_type: alarm
    severity: trip
    alert_style: blink
    ack_rearm: auto
    pair_id: pair_feed_pump
    pair_mode: bottom
    primary_mode: name

  - entity: ""
