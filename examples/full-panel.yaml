# Feature-oriented example. Replace entity IDs with entities that exist in your HA.
type: custom:annunciator-grid-card
title: Main Annunciator
panel_id: main_annunciator
columns: 4
panel_sizing: auto_fit
row_mode: auto
panel_theme: avionics
default_lamp_style: modern
default_lens_type: glass
allow_lamp_style_override: true
allow_lens_override: true
show_ack_all: true
show_clear_ack: true
ack_store:
  type: input_text
  entity: input_text.annunciator_ack_map
lamp_test_entity: input_boolean.annunciator_lamp_test
lamp_test_mode: steady
pair_ack_lock: true
severity_colors:
  enabled: true
  on: "#8bd66a"
  on_enabled: true
  off: "#f2f2f2"
  off_enabled: true
  status: "#8bd66a"
  status_enabled: true
  warn: "#ffd24a"
  warn_enabled: true
  alarm: "#ffb000"
  alarm_enabled: true
  trip: "#ff3a2f"
  trip_enabled: true
  unavailable: "#bdbdbd"
  unavailable_enabled: true
  frame_enabled: false
  panel_enabled: false
show_group_headers: true
group_ack:
  ack_scope: alerting
  include_change: true
group_header:
  show_buttons: true
  button_mode: icons
  show_ack_alerts_button: true
history_overlay:
  enabled: true
  show_icon: true
entities:
  - entity: light.porch
    group: House
    lamp_type: status
    color_behavior: standard
    eval_mode: toggle
    alert_style: none
    primary_mode: name
    secondary_mode: state
    tap_action: toggle
    double_tap_action: more_info
    hold_action: none

  - entity: binary_sensor.front_door
    group: House
    lamp_type: status
    color_behavior: standard
    eval_mode: state_equals
    on_states: open
    primary_mode: name
    secondary_mode: state
    blink_on_change: true
    blink_on_change_until_ack: false
    blink_on_change_seconds: 3
    alert_on_change_style: flash

  - entity: binary_sensor.boiler_trip
    group: Boiler
    lamp_type: alarm
    color_behavior: severity
    severity: trip
    eval_mode: toggle
    alert_style: blink
    alert_when: on
    ack_rearm: auto
    primary_mode: name
    secondary_mode: state

  - entity: sensor.stack_temperature
    group: Boiler
    lamp_type: sensor
    color_behavior: severity
    severity: status
    always_on: true
    primary_mode: name
    secondary_mode: state
    value_format:
      decimals: 1
      unit: auto
      scale: 1
      offset: 0
    enable_auto_styles: true
    auto_styles:
      - name: Trip
        kind: numeric
        rule: {type: above, a: 200, inclusive: true}
        severity: trip
        alert: blink
      - name: Alarm
        kind: numeric
        rule: {type: above, a: 175, inclusive: true}
        severity: alarm
        alert: pulse
      - name: Maintenance suppress
        source: entity
        source_entity: input_boolean.maintenance_mode
        kind: state
        state: "on"
        force_state: off
        alert: off

  - entity: ""

  - entity: binary_sensor.garage_door_open
    group: Garage
    lamp_type: status
    color_behavior: standard
    tap_action: toggle
    tap_target: entity
    tap_entity: cover.garage_door
    double_tap_action: more_info
    double_tap_target: entity
    double_tap_entity: cover.garage_door
    hold_action: none
