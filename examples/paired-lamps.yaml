# A TOP/BOTTOM pair occupies one physical panel cell.
type: custom:annunciator-grid-card
title: Pump Pair
columns: 2
pair_ack_lock: true
entities:
  - entity: binary_sensor.pump_running
    uid: pump_run
    pair_id: pump_pair_1
    pair_mode: top
    lamp_type: status
    color_behavior: standard
    eval_mode: toggle
    primary_mode: name
    secondary_mode: state
    tap_action: more_info

  - entity: binary_sensor.pump_trip
    uid: pump_trip
    pair_id: pump_pair_1
    pair_mode: bottom
    lamp_type: alarm
    color_behavior: severity
    severity: trip
    eval_mode: toggle
    alert_style: blink
    alert_when: on
    ack_rearm: auto
    primary_mode: name
    secondary_mode: state
