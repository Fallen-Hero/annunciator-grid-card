# Severity ladder for a numeric sensor. First matching rule wins, so highest
# thresholds belong first.
type: custom:annunciator-grid-card
title: Temperature Status
entities:
  - entity: sensor.stack_temperature
    lamp_type: sensor
    color_behavior: severity
    severity: status
    always_on: true
    primary_mode: name
    secondary_mode: state
    value_format:
      mode: number
      decimals: 1
      rounding: round
      unit: auto
      convert: none
      scale: 1
      offset: 0
    enable_auto_styles: true
    auto_styles:
      - name: Trip
        kind: numeric
        rule:
          type: above
          a: 200
          inclusive: true
        severity: trip
        alert: blink
      - name: Alarm
        kind: numeric
        rule:
          type: above
          a: 175
          inclusive: true
        severity: alarm
        alert: pulse
      - name: Warning
        kind: numeric
        rule:
          type: above
          a: 150
          inclusive: true
        severity: warn
        alert: off
