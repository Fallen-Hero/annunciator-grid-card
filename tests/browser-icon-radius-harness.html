<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Annunciator icon and rounded-surface validation</title>
  <style>
    :root{color-scheme:dark;--primary-color:#42a5f5;--primary-text-color:#f5f7fa;--secondary-text-color:#b7c0ce;--divider-color:#566070;--card-background-color:#262b33}
    *{box-sizing:border-box}body{margin:0;padding:20px;background:#171a1f;color:var(--primary-text-color);font-family:system-ui,sans-serif}.host{max-width:920px;margin:0 auto;padding:16px;border:1px solid #46505e;border-radius:12px;background:#20252c}.mobile .host{max-width:430px}h1{margin:0 0 6px;font-size:22px}.intro{margin:0 0 14px;color:var(--secondary-text-color)}.audit{padding:9px 11px;border:1px solid #3d7c52;border-radius:8px;background:#173222;color:#a8e6b8;font-weight:700}.cards{display:grid;grid-template-columns:1fr;gap:16px;margin:16px 0}annunciator-grid-card-editor{display:block;width:100%}ha-form select,ha-form input{width:100%;min-height:46px;border:1px solid #5b6675;border-radius:6px;padding:0 10px;background:#2d333c;color:#f5f7fa}ha-switch input{width:20px;height:20px}ha-icon{display:inline-flex;align-items:center;justify-content:center;font-size:calc(var(--mdc-icon-size,40px) * .72);line-height:1}
  </style>
  <script>
    window.browserErrors=[];addEventListener("error",e=>browserErrors.push(String(e.error?.stack||e.message)));addEventListener("unhandledrejection",e=>browserErrors.push(String(e.reason?.stack||e.reason)));
    class MockHaSwitch extends HTMLElement{set checked(v){this._checked=!!v;this._render()}get checked(){return!!this._checked}connectedCallback(){this._render()}_render(){this.textContent="";const i=document.createElement("input");i.type="checkbox";i.checked=this.checked;i.addEventListener("change",()=>{this._checked=i.checked;this.dispatchEvent(new Event("change",{bubbles:true}))});this.append(i)}}
    class MockHaForm extends HTMLElement{set schema(v){this._schema=v;this._render()}get schema(){return this._schema||[]}set data(v){this._data=v||{};this._render()}get data(){return this._data||{}}connectedCallback(){this._render()}_emit(value){this.dispatchEvent(new CustomEvent("value-changed",{detail:{value:{v:value}},bubbles:true}))}_render(){this.textContent="";const e=this.schema[0];if(!e)return;if(e.selector?.select){const s=document.createElement("select");for(const o of e.selector.select.options||[]){const n=document.createElement("option");n.value=o.value;n.textContent=o.label;s.append(n)}s.value=String(this.data[e.name]??"");s.addEventListener("change",()=>this._emit(s.value));this.append(s)}else{const i=document.createElement("input");i.value=String(this.data[e.name]||"");i.placeholder=e.selector?.icon?"Select icon":"Select entity";i.addEventListener("change",()=>this._emit(i.value));this.append(i)}}}
    class MockHaIcon extends HTMLElement{static get observedAttributes(){return["icon"]}connectedCallback(){this._render()}attributeChangedCallback(){this._render()}_render(){this.textContent=this.hasAttribute("icon")?"◆":"";this.title=this.getAttribute("icon")||""}}
    customElements.define("ha-switch",MockHaSwitch);customElements.define("ha-form",MockHaForm);customElements.define("ha-icon",MockHaIcon);
  </script>
  <script src="../dist/annunciator-grid-card.js?v=icons-lines-fonts-centering-cp23"></script>
</head>
<body data-ready="false" data-status="running">
  <script>if(new URLSearchParams(location.search).get("mobile")==="1")document.body.classList.add("mobile")</script>
  <main class="host">
    <h1>Icons and rounded surfaces</h1>
    <p class="intro">Opt-in icon content and independently rounded panel, header, frame, and lamp bezel surfaces.</p>
    <p id="audit" class="audit">Running browser audit…</p>
    <div class="cards"><annunciator-grid-card id="iconCard"></annunciator-grid-card><annunciator-grid-card id="legacyCard"></annunciator-grid-card></div>
    <annunciator-grid-card-editor id="editor"></annunciator-grid-card-editor>
  </main>
  <script>
    const hass={states:{"binary_sensor.server":{state:"on",attributes:{friendly_name:"Server",icon:"mdi:server"}},"binary_sensor.door":{state:"off",attributes:{friendly_name:"Door",icon:"mdi:door"}},"switch.pump":{state:"on",attributes:{friendly_name:"Pump"}}},callService:async()=>{},language:"en"};
    const iconConfig={type:"custom:annunciator-grid-card",config_version:3,title:"ROUNDED ICON PANEL",columns:3,cell_width:190,cell_height:130,outer_frame:9,corner_style:"rounded",corner_radius:18,lamp_font_family:"custom",lamp_font_custom:'"Panel Face", sans-serif',panel_appearance:{background_enabled:true,background:"#26343d",border_enabled:true,border:"#6d8795",frame_enabled:true,frame:"#10222c",lamp_frame_mode:"custom",lamp_frame:"#1b4455",radius_enabled:true,radius:22,frame_radius_enabled:true,frame_radius:28},header_appearance:{background_enabled:true,background:"#14242d",border_enabled:true,border:"#6d8795",border_width:2,radius_enabled:true,radius:17,font_family:"custom",font_custom:'"Header Face", sans-serif'},entities:[{uid:"server",ack_slot:1,entity:"binary_sensor.server",name_override:"Server",content_mode:"icon",icon:"mdi:server-network",icon_size:58,icon_color_enabled:true,icon_color:"#63d8ff",shape:"round_rectangle"},{uid:"door",ack_slot:2,entity:"binary_sensor.door",name_override:"Door",content_mode:"icon_text",icon_show_primary:false,icon_show_secondary:true,icon_show_tertiary:false,icon_size:38,primary_mode:"name",secondary_mode:"state",tertiary_mode:"entity_id",shape:"circle"},{uid:"pump",ack_slot:3,entity:"switch.pump",name_override:"Pump",content_mode:"icon",icon_size:46,shape:"pill"},{uid:"pair-top",ack_slot:4,entity:"binary_sensor.server",pair_id:"icon-pair",pair_mode:"top",content_mode:"icon",icon:"mdi:arrow-up-bold",icon_size:34},{uid:"pair-bottom",ack_slot:5,entity:"binary_sensor.door",pair_id:"icon-pair",pair_mode:"bottom",content_mode:"icon_text",icon:"mdi:arrow-down-bold",icon_size:28,primary_mode:"name",secondary_mode:"none"}]};
    const legacyConfig={type:"custom:annunciator-grid-card",config_version:3,columns:1,cell_width:190,cell_height:100,entities:[{uid:"legacy",ack_slot:1,entity:"binary_sensor.server",primary_mode:"name",secondary_mode:"state",font_family:"custom",font_custom:'"Lamp Face", serif'}]};
    const iconCard=document.getElementById("iconCard"),legacyCard=document.getElementById("legacyCard"),editor=document.getElementById("editor");iconCard.setConfig(iconConfig);iconCard.hass=hass;legacyCard.setConfig(legacyConfig);legacyCard.hass=hass;editor.hass=hass;editor.setConfig(iconConfig);editor.shadowRoot.getElementById("panelSettings").open=true;editor._selectedLamp=1;editor._page="display";editor._renderEditor();editor._panelPage="appearance";editor._renderPanel();
    const failures=[];
    setTimeout(()=>{
      const iconPanel=iconCard.shadowRoot.getElementById("panelScale"),iconGrid=iconCard.shadowRoot.getElementById("grid"),iconHeader=iconCard.shadowRoot.getElementById("header"),cells=[...iconGrid.querySelectorAll(":scope>.cell")],server=cells[0],door=cells[1],pump=cells[2],pair=cells[3],legacyPanel=legacyCard.shadowRoot.getElementById("panelScale"),legacyGrid=legacyCard.shadowRoot.getElementById("grid"),legacyCell=legacyGrid.querySelector(".cell"),legacyIcon=legacyCell.querySelector(".lampIcon");
      const serverIcon=server.querySelector(".lampIcon"),doorIcon=door.querySelector(".lampIcon"),pumpIcon=pump.querySelector(".lampIcon");
      if(!server.classList.contains("content-icon-only")||serverIcon.getAttribute("icon")!=="mdi:server-network")failures.push("custom-icon");
      if(getComputedStyle(serverIcon).color!=="rgb(99, 216, 255)"||serverIcon.style.getPropertyValue("--annun-icon-size")!=="58px")failures.push("icon-color-size");
      if(getComputedStyle(server.querySelector(".primaryLine")).display!=="none"||getComputedStyle(server.querySelector(".secondaryLine")).display!=="none")failures.push("icon-only-text");
      if(!door.classList.contains("content-icon-text")||doorIcon.getAttribute("icon")!=="mdi:door")failures.push("icon-text-entity-fallback");
      if(getComputedStyle(door.querySelector(".primaryLine")).display!=="none"||getComputedStyle(door.querySelector(".secondaryLine")).display==="none"||getComputedStyle(door.querySelector(".tertiaryLine")).display!=="none")failures.push("icon-selected-lines");
      if(pumpIcon.getAttribute("icon")!=="mdi:toggle-switch")failures.push("domain-fallback");
      if(pair.querySelector(".pairHalf.top .lampIcon")?.getAttribute("icon")!=="mdi:arrow-up-bold"||pair.querySelector(".pairHalf.bottom .lampIcon")?.getAttribute("icon")!=="mdi:arrow-down-bold")failures.push("paired-icons");
      if(getComputedStyle(iconPanel).borderRadius!=="22px"||getComputedStyle(iconPanel).overflow!=="hidden")failures.push("panel-radius");
      if(getComputedStyle(iconGrid).borderRadius!=="28px")failures.push("frame-radius");
      if(getComputedStyle(iconHeader).borderRadius!=="17px")failures.push("header-radius");
      if(getComputedStyle(server).borderRadius!=="18px"||getComputedStyle(server.querySelector(".window")).borderRadius!=="18px")failures.push("bezel-radius");
      const legacyWindow=legacyCell.querySelector(".window"),legacyText=legacyCell.querySelector(".text"),windowRect=legacyWindow.getBoundingClientRect(),textRect=legacyText.getBoundingClientRect(),centerDelta=Math.abs((windowRect.top+windowRect.height/2)-(textRect.top+textRect.height/2));
      if(getComputedStyle(legacyPanel).borderRadius!=="0px"||getComputedStyle(legacyGrid).borderRadius!=="0px"||legacyIcon.hidden!==true||getComputedStyle(legacyIcon).display!=="none"||legacyIcon.getBoundingClientRect().height!==0||centerDelta>1||legacyCell.classList.contains("content-icon-only")||legacyCell.classList.contains("content-icon-text"))failures.push(`legacy-default-center:${centerDelta.toFixed(2)}`);
      if(getComputedStyle(iconGrid).getPropertyValue("--annun-lamp-font-family").trim()!=='"Panel Face", sans-serif'||getComputedStyle(legacyCell).getPropertyValue("--lamp-font-family").trim()!=='"Lamp Face", serif'||getComputedStyle(iconHeader).getPropertyValue("--annun-header-font-family").trim()!=='"Header Face", sans-serif')failures.push("custom-font-cascade");
      const hint=editor.shadowRoot.querySelector(".toolbar .hint")?.textContent;if(hint!=="v1.1.0")failures.push(`version-hint:${hint}`);
      if(editor.shadowRoot.textContent.includes("Panel default (v1.0.2)"))failures.push("legacy-label");
      editor._page="appearance";editor._renderEditor();const shapeForm=[...editor.shadowRoot.querySelectorAll("#editor ha-form")].find(form=>form.schema?.[0]?.selector?.select?.options?.some(o=>o.value==="inherit"&&o.label==="Panel default"));if(!shapeForm)failures.push("panel-default-label");
      editor._selectedLamp=0;editor._page="display";editor._renderEditor();const iconForm=[...editor.shadowRoot.querySelectorAll("#editor ha-form")].find(form=>form.schema?.[0]?.selector?.icon);if(!iconForm||iconForm.data?.v!=="mdi:server-network")failures.push("icon-selector");
      editor._selectedLamp=1;editor._page="display";editor._renderEditor();const displayText=editor.shadowRoot.getElementById("editor").textContent;for(const label of ["Text with icon","Show primary","Show secondary","Show tertiary","Lamp font"])if(!displayText.includes(label))failures.push(`missing:${label}`);
      editor._config.entities[1]={...editor._config.entities[1],font_family:"custom",font_custom:'"Editor Face", sans-serif'};editor._renderEditor();if(!editor.shadowRoot.getElementById("editor").textContent.includes("Custom font"))failures.push("custom-lamp-font-editor");
      editor._panelPage="appearance";editor._renderPanel();const appearanceText=editor.shadowRoot.getElementById("panelBody").textContent;for(const label of ["Panel corners","Outer frame corners","Lamp bezel corners","Header corner radius","Custom header font"])if(!appearanceText.includes(label))failures.push(`missing:${label}`);
      editor._panelPage="layout";editor._renderPanel();if(!editor.shadowRoot.getElementById("panelBody").textContent.includes("Custom lamp font"))failures.push("custom-panel-font-editor");
      const shell=editor.shadowRoot.querySelector(".shell"),panelBody=editor.shadowRoot.getElementById("panelBody");if(shell.scrollWidth!==shell.clientWidth||panelBody.scrollWidth!==panelBody.clientWidth)failures.push(`overflow:${shell.scrollWidth}/${shell.clientWidth}:${panelBody.scrollWidth}/${panelBody.clientWidth}`);
      if(browserErrors.length)failures.push(`browser-errors:${browserErrors.length}`);
      window.iconRadiusValidation={failures,widths:{shell:[shell.clientWidth,shell.scrollWidth],panel:[panelBody.clientWidth,panelBody.scrollWidth]},icons:{server:serverIcon.getAttribute("icon"),door:doorIcon.getAttribute("icon"),pump:pumpIcon.getAttribute("icon")},centerDelta,fonts:{panel:getComputedStyle(iconGrid).getPropertyValue("--annun-lamp-font-family").trim(),lamp:getComputedStyle(legacyCell).getPropertyValue("--lamp-font-family").trim(),header:getComputedStyle(iconHeader).getPropertyValue("--annun-header-font-family").trim()},radii:{panel:getComputedStyle(iconPanel).borderRadius,frame:getComputedStyle(iconGrid).borderRadius,header:getComputedStyle(iconHeader).borderRadius,bezel:getComputedStyle(server).borderRadius},errors:browserErrors};
      const audit=document.getElementById("audit");audit.textContent=failures.length?`Browser audit failed: ${failures.join(" · ")}`:"Browser audit passed: centered text-only layout · independent icon lines · panel/lamp/header custom fonts · icon/entity/domain/paired rendering · rounded surfaces · compact overflow · no browser errors";audit.style.borderColor=failures.length?"#9b3f49":"#3d7c52";audit.style.background=failures.length?"#3b1c21":"#173222";document.body.dataset.status=failures.length?"fail":"pass";document.body.dataset.ready="true";
    },180);
  </script>
</body>
</html>
