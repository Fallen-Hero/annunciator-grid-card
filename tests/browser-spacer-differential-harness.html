<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Legacy spacer differential</title><style>:root{color-scheme:dark}body{margin:0;padding:20px;background:#171a1f;color:#f5f7fa;font-family:system-ui,sans-serif}.audit{padding:10px 12px;border:1px solid #8b6a28;border-radius:8px;background:#382c15;font-weight:800}.frames{display:flex;gap:14px;flex-wrap:wrap}iframe{width:250px;height:180px;border:1px solid #506070}</style></head><body data-ready="false" data-status="running"><h1>v1.0.2 spacer differential</h1><p id="audit" class="audit">Comparing…</p><div class="frames"><iframe title="Immutable v1.0.2" src="browser-spacer-differential-child.html?baseline=1"></iframe><iframe title="v1.1.0 compatibility" src="browser-spacer-differential-child.html?baseline=0"></iframe></div><script>
const results={},errors=[];addEventListener('error',e=>errors.push(String(e.message)));addEventListener('message',e=>{if(e.data?.type==='spacer-diff-error')errors.push(`load:${e.data.baseline}`);if(e.data?.type!=='spacer-diff')return;results[e.data.baseline?'old':'next']=e.data.snapshot;if(results.old&&results.next){const differences=Object.keys(results.old).filter(k=>JSON.stringify(results.old[k])!==JSON.stringify(results.next[k]));const failures=[...differences.map(k=>`${k}: ${results.old[k]} != ${results.next[k]}`),...errors];const audit=document.getElementById('audit');audit.textContent=failures.length?`Differential failed: ${failures.join(' · ')}`:`Differential passed: ${Object.keys(results.old).length} computed spacer properties match immutable v1.0.2`;audit.style.borderColor=failures.length?'#a54d5b':'#3d7c52';audit.style.background=failures.length?'#3c1d23':'#173222';window.spacerDifferential={failures,old:results.old,next:results.next};document.body.dataset.status=failures.length?'fail':'pass';document.body.dataset.ready='true'}});
</script></body></html>
