<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="640" viewBox="0 0 1280 640" role="img" aria-labelledby="title desc">
  <title id="title">Annunciator Grid Card</title>
  <desc id="desc">A realistic labeled red, white, and green annunciator panel beside the Annunciator Grid Card name and Alarm, Status, Control brand line.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#161b21"/><stop offset="0.62" stop-color="#090c0f"/><stop offset="1" stop-color="#050607"/></linearGradient>
    <linearGradient id="bezel" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#4a5057"/><stop offset="0.48" stop-color="#1b2025"/><stop offset="1" stop-color="#07090b"/></linearGradient>
    <radialGradient id="red" cx="43%" cy="35%" r="76%"><stop stop-color="#ff7b77"/><stop offset="0.34" stop-color="#ef4144"/><stop offset="0.78" stop-color="#c8222a"/><stop offset="1" stop-color="#7f0f15"/></radialGradient>
    <radialGradient id="white" cx="43%" cy="35%" r="76%"><stop stop-color="#fff"/><stop offset="0.4" stop-color="#f1f3f5"/><stop offset="0.8" stop-color="#bcc3ca"/><stop offset="1" stop-color="#7d8790"/></radialGradient>
    <radialGradient id="green" cx="43%" cy="35%" r="76%"><stop stop-color="#bdffa1"/><stop offset="0.34" stop-color="#78dc5b"/><stop offset="0.77" stop-color="#48a039"/><stop offset="1" stop-color="#236124"/></radialGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="180%"><feDropShadow dx="0" dy="18" stdDeviation="18" flood-color="#000" flood-opacity="0.82"/></filter>
  </defs>
  <rect width="1280" height="640" fill="url(#bg)"/><path d="M0 520 L1280 365 L1280 640 L0 640Z" fill="#0a0e12"/>
  <circle cx="1140" cy="40" r="270" fill="#78dc5b" opacity="0.035"/><circle cx="20" cy="620" r="300" fill="#e63b3f" opacity="0.045"/>
  <g transform="translate(70 155)" filter="url(#shadow)">
    <rect width="474" height="330" rx="29" fill="url(#bezel)" stroke="#59616a" stroke-width="4"/><rect x="17" y="17" width="440" height="296" rx="20" fill="#040507" stroke="#000" stroke-width="5"/>
    <g stroke="#171b20" stroke-width="11">
      <rect x="36" y="36" width="126" height="120" rx="15" fill="url(#red)"/><rect x="174" y="36" width="126" height="120" rx="15" fill="url(#white)"/><rect x="312" y="36" width="126" height="120" rx="15" fill="url(#red)"/>
      <rect x="36" y="174" width="126" height="120" rx="15" fill="url(#green)"/><rect x="174" y="174" width="126" height="120" rx="15" fill="url(#green)"/><rect x="312" y="174" width="126" height="120" rx="15" fill="url(#white)"/>
    </g>
    <g fill="#101418" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="900" text-anchor="middle" letter-spacing="1.4">
      <text x="99" y="101">ALARM</text><text x="237" y="101">READY</text><text x="375" y="101">TRIP</text>
      <text x="99" y="239">ACTIVE</text><text x="237" y="239">NORMAL</text><text x="375" y="239">STATUS</text>
    </g>
  </g>
  <g transform="translate(610 190)">
    <text x="0" y="0" fill="#f5f7f9" font-family="Arial, Helvetica, sans-serif" font-size="60" font-weight="800" letter-spacing="4">ANNUNCIATOR</text>
    <text x="0" y="76" fill="#78dc5b" font-family="Arial, Helvetica, sans-serif" font-size="60" font-weight="800" letter-spacing="8">GRID CARD</text>
    <rect x="2" y="108" width="510" height="4" fill="#e63b3f"/><rect x="512" y="108" width="91" height="4" fill="#78dc5b"/>
    <text x="2" y="164" fill="#c0c7cf" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="700" letter-spacing="3">ALARM · STATUS · CONTROL</text>
    <text x="2" y="207" fill="#78838e" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="600" letter-spacing="3">FOR HOME ASSISTANT</text>
  </g>
</svg>
