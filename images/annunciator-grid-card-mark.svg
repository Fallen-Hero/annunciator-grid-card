<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
  <title id="title">Annunciator Grid Card mark</title>
  <desc id="desc">A three by three matrix of illuminated red, white, and green annunciator lamps in a dark industrial bezel.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#171b20"/><stop offset="1" stop-color="#080a0c"/></linearGradient>
    <linearGradient id="bezel" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#4a5057"/><stop offset="0.48" stop-color="#1b2025"/><stop offset="1" stop-color="#07090b"/></linearGradient>
    <radialGradient id="red" cx="42%" cy="34%" r="76%"><stop stop-color="#ff7b77"/><stop offset="0.34" stop-color="#ef4144"/><stop offset="0.78" stop-color="#c8222a"/><stop offset="1" stop-color="#7f0f15"/></radialGradient>
    <radialGradient id="white" cx="42%" cy="34%" r="76%"><stop stop-color="#fff"/><stop offset="0.4" stop-color="#f1f3f5"/><stop offset="0.8" stop-color="#bcc3ca"/><stop offset="1" stop-color="#7d8790"/></radialGradient>
    <radialGradient id="green" cx="42%" cy="34%" r="76%"><stop stop-color="#bdffa1"/><stop offset="0.34" stop-color="#78dc5b"/><stop offset="0.77" stop-color="#48a039"/><stop offset="1" stop-color="#236124"/></radialGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="180%"><feDropShadow dx="0" dy="14" stdDeviation="16" flood-color="#000" flood-opacity="0.72"/></filter>
  </defs>
  <rect width="512" height="512" rx="68" fill="url(#background)"/>
  <g transform="translate(46 46)" filter="url(#shadow)">
    <rect width="420" height="420" rx="42" fill="url(#bezel)" stroke="#59616a" stroke-width="4"/>
    <rect x="17" y="17" width="386" height="386" rx="28" fill="#040507" stroke="#000" stroke-width="5"/>
    <g stroke="#15191e" stroke-width="11">
      <rect x="35" y="35" width="108" height="108" rx="15" fill="url(#red)"/>
      <rect x="156" y="35" width="108" height="108" rx="15" fill="url(#white)"/>
      <rect x="277" y="35" width="108" height="108" rx="15" fill="url(#green)"/>
      <rect x="35" y="156" width="108" height="108" rx="15" fill="url(#white)"/>
      <rect x="156" y="156" width="108" height="108" rx="15" fill="url(#green)"/>
      <rect x="277" y="156" width="108" height="108" rx="15" fill="url(#red)"/>
      <rect x="35" y="277" width="108" height="108" rx="15" fill="url(#green)"/>
      <rect x="156" y="277" width="108" height="108" rx="15" fill="url(#red)"/>
      <rect x="277" y="277" width="108" height="108" rx="15" fill="url(#white)"/>
    </g>
  </g>
</svg>
